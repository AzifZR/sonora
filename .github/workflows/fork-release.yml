# Fork release pipeline: Windows x64 only. Push a tag like v0.34.0 and this
# builds the release binary, packs the Inno Setup installer, and publishes
# a GitHub Release with Sonora-Setup.exe + SHA256SUMS — the exact assets the
# in-app updater looks for. Replaces the upstream multi-OS pipeline, which
# needs secrets this fork does not have.
name: fork-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1

jobs:
  build:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: name the version
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="$(git rev-parse --short HEAD)" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: build
        run: cargo build --release --locked --package sonora

      - name: stage the executable
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/sonora.exe "dist/sonora-$VERSION-x86_64-pc-windows-msvc.exe"

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $number = $env:VERSION.TrimStart("v")
          if ($number -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            $number = "0.0.0"
          }
          $env:SONORA_VERSION = $number
          $env:SONORA_EXE = (Resolve-Path "target/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          $env:SONORA_ARCH = "x64compatible"
          $env:SONORA_SETUP = "Sonora-Setup"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      - name: checksums
        shell: pwsh
        run: |
          cd dist
          # Collect first: Out-File creates its target up front, and a lazy
          # glob would then feed the output file back into its own input.
          $files = Get-ChildItem * -File | Where-Object { $_.Name -ne 'SHA256SUMS' }
          $files |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Out-File -Encoding ascii SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
